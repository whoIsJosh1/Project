<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* Background image behind glass */
      background: url("bg_about.jpg") no-repeat center center/cover;
      height: 100vh;
    }

    /* Glass effect section */
    .location-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;

      /* Glass window effect */
      background: rgba(255, 255, 255, 0.15); /* transparent white */
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px); /* Safari support */

      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);

      color: white;
      text-align: center;
      padding: 40px 10px;
      box-sizing: border-box;
    }

    .location-section h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    .map-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Location Section -->
  <section class="location-section" id="location">
    <h1>Find Us Here</h1>
    <div class="map-container">
      <iframe src="https://www.google.com/maps/embed?pb=!1m21!1m12!1m3!1d52059.73032732051!2d121.12853419670965!3d14.11476043697402!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m6!3e6!4m0!4m3!3m2!1d14.106399999999999!2d121.14281!5e0!3m2!1sen!2sph!4v1756982218501!5m2!1sen!2sph" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>
</body>
</html>
